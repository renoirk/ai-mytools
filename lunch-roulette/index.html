<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 팀 점심 메뉴 룰렛!</title>
<style>
  :root {
    --pink:#ff5f8f; --yellow:#ffd84d; --blue:#57b8ff; --green:#79d86f;
    --purple:#a978ff; --orange:#ff9d43; --ink:#453b4d;
    --cream:#fff8df;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family: "Arial","Malgun Gothic",sans-serif;
    color:var(--ink); background:
      radial-gradient(circle at 10% 15%, #fff 0 8px, transparent 9px),
      radial-gradient(circle at 90% 20%, #ffd6e4 0 7px, transparent 8px),
      linear-gradient(135deg,#fff9e7,#fff1c9);
    display:flex; justify-content:center; padding:28px 16px 42px;
  }
  .app { width:min(980px,100%); }
  .hero { text-align:center; margin-bottom:18px; position:relative; }
  .bubble {
    display:inline-block; background:#fff; border:4px solid #ff9bad;
    border-radius:999px; padding:9px 18px; font-weight:800; color:#ff557d;
    transform:rotate(-3deg); box-shadow:0 5px 0 #ffd1db;
  }
  h1 { margin:14px 0 4px; font-size:clamp(34px,7vw,64px); line-height:1;
       letter-spacing:-3px; text-shadow:3px 3px 0 #fff; }
  h1 .a{color:#ff557d} h1 .b{color:#59bb4c} h1 .c{color:#7655d8}
  .subtitle { margin:10px 0 0; font-size:18px; font-weight:700; }
  .card {
    background:rgba(255,255,255,.9); border:3px solid #ffd9df; border-radius:32px;
    box-shadow:0 16px 40px rgba(113,82,75,.12); padding:24px;
  }
  .roulette-wrap { display:flex; flex-direction:column; align-items:center; }
  .wheel-box { position:relative; width:min(620px,92vw); aspect-ratio:1; margin:4px auto 18px; }
  canvas { width:100%; height:100%; display:block; filter:drop-shadow(0 12px 12px rgba(0,0,0,.13)); }
  .pointer {
    position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:20px solid transparent; border-right:20px solid transparent;
    border-top:0; border-bottom:45px solid #ff4e76; z-index:5;
    filter:drop-shadow(0 4px 2px rgba(0,0,0,.15));
  }
  .pointer::after { content:"★"; position:absolute; left:-11px; top:8px; color:white; font-size:20px; }
  .spin {
    border:0; cursor:pointer; color:white; font-size:28px; font-weight:900;
    padding:15px 48px; border-radius:999px; background:linear-gradient(135deg,#ff4f7d,#ff8eab);
    box-shadow:0 7px 0 #d93e66, 0 12px 22px rgba(255,79,125,.25);
    transition:.15s transform,.15s box-shadow; user-select:none;
  }
  .spin:hover { transform:translateY(-2px); }
  .spin:active { transform:translateY(5px); box-shadow:0 2px 0 #d93e66; }
  .spin:disabled { opacity:.65; cursor:not-allowed; }
  .result {
    margin:22px auto 0; width:min(760px,100%); padding:18px 22px;
    border:3px dashed #ffc4cf; border-radius:22px; background:#fffdf7; text-align:center;
  }
  .result small { font-weight:800; color:#9a8792; }
  #resultText { margin:4px 0 0; font-size:clamp(25px,5vw,42px); font-weight:900; }
  .hint { margin-top:10px; font-size:14px; color:#8d7b85; }
  .menu-list { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:18px; }
  .chip { padding:8px 13px; border-radius:999px; font-weight:800; font-size:14px; }
  .c1{background:#ffd6df}.c2{background:#ffeaa8}.c3{background:#d9f3c8}
  .c4{background:#e5d6ff}.c5{background:#cfeeff}.c6{background:#ffd7b0}
  footer { text-align:center; margin-top:18px; color:#8d7b85; font-size:14px; }
  .share {
    margin-top:14px; border:2px solid #eadde2; background:white; color:#6c5b66;
    padding:10px 17px; border-radius:999px; font-weight:800; cursor:pointer;
  }
  .share:hover { background:#fff7fa; }
  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .piece { position:absolute; top:-20px; width:10px; height:16px; animation:fall 1.8s linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:0; } }
  @media (max-width:600px) {
    body{padding:16px 10px 30px}.card{padding:14px;border-radius:24px}
    .spin{font-size:22px;padding:13px 38px}.subtitle{font-size:15px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="bubble">오늘 뭐 먹지? 🍴</div>
    <h1><span class="a">우리 팀</span> <span class="b">점심 메뉴</span> <span class="c">룰렛!</span></h1>
    <p class="subtitle">돌려돌려~ 오늘의 점심 메뉴를 정해보세요!</p>
  </header>

  <main class="card">
    <div class="roulette-wrap">
      <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900" aria-label="점심 메뉴 룰렛"></canvas>
      </div>
      <button class="spin" id="spinBtn">🎯 돌리기!</button>

      <section class="result" aria-live="polite">
        <small>오늘의 메뉴는?</small>
        <div id="resultText">버튼을 눌러 룰렛을 돌려보세요!</div>
        <div class="hint">팀원 누구나 이 링크를 열고 각자 룰렛을 돌릴 수 있어요.</div>
      </section>

      <div class="menu-list">
        <span class="chip c1">🍲 김치찌개</span>
        <span class="chip c2">🍱 돈까스</span>
        <span class="chip c3">🍣 초밥</span>
        <span class="chip c4">🥗 샐러드</span>
        <span class="chip c5">🍜 쌀국수</span>
        <span class="chip c6">🍔 햄버거</span>
      </div>
      <button class="share" id="shareBtn">🔗 팀원에게 공유하기</button>
    </div>
  </main>
  <footer>💗 맛있는 점심 드시고 즐거운 하루 보내세요!</footer>
</div>
<div class="confetti" id="confetti"></div>

<script>
const menus = [
  {name:"김치찌개", emoji:"🍲", color:"#ff647a"},
  {name:"돈까스",   emoji:"🍱", color:"#ffd04d"},
  {name:"초밥",     emoji:"🍣", color:"#7ed957"},
  {name:"샐러드",   emoji:"🥗", color:"#a978ff"},
  {name:"쌀국수",   emoji:"🍜", color:"#57b8ff"},
  {name:"햄버거",   emoji:"🍔", color:"#ff9b43"}
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;
let rotation = 0;
let spinning = false;

function drawWheel() {
  const cx = canvas.width/2, cy = canvas.height/2, r = 400;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // outer rings
  ctx.beginPath(); ctx.arc(cx,cy,r+25,0,TAU);
  ctx.fillStyle="#ff6b8d"; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r+10,0,TAU);
  ctx.fillStyle="#ffcfdf"; ctx.fill();

  const slice = TAU/menus.length;
  menus.forEach((m,i)=>{
    const a0 = rotation + i*slice - Math.PI/2;
    const a1 = a0 + slice;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle=m.color; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=6; ctx.stroke();

    const mid=(a0+a1)/2;
    const tx=cx+Math.cos(mid)*260, ty=cy+Math.sin(mid)*260;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="bold 38px Arial, Malgun Gothic, sans-serif";
    ctx.lineWidth=10; ctx.strokeStyle="rgba(255,255,255,.9)";
    ctx.strokeText(m.name,tx,ty-24); ctx.fillStyle="#fff"; ctx.fillText(m.name,tx,ty-24);
    ctx.font="48px Arial"; ctx.fillText(m.emoji,tx,ty+35);
  });

  // center
  ctx.beginPath(); ctx.arc(cx,cy,105,0,TAU); ctx.fillStyle="#fffaf5"; ctx.fill();
  ctx.strokeStyle="#ffb6c8"; ctx.lineWidth=7; ctx.stroke();
  ctx.font="48px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("⭐",cx,cy);
}

function easeOut(t){ return 1-Math.pow(1-t,4); }

function spin() {
  if(spinning) return;
  spinning=true; document.getElementById("spinBtn").disabled=true;
  const winner=Math.floor(Math.random()*menus.length);
  const slice=TAU/menus.length;

  // Make the center of the winning slice land under the top pointer.
  const targetBase = -Math.PI/2 - (winner+0.5)*slice;
  let delta = targetBase - rotation;
  delta = ((delta % TAU)+TAU)%TAU;
  const turns = 6 + Math.floor(Math.random()*3);
  const start=rotation, end=rotation + turns*TAU + delta;
  const duration=4200, t0=performance.now();

  function frame(now){
    const p=Math.min(1,(now-t0)/duration);
    rotation=start+(end-start)*easeOut(p);
    drawWheel();
    if(p<1) requestAnimationFrame(frame);
    else {
      spinning=false; document.getElementById("spinBtn").disabled=false;
      const m=menus[winner];
      document.getElementById("resultText").textContent=`${m.emoji} ${m.name} 먹으러 가요!`;
      celebrate();
    }
  }
  requestAnimationFrame(frame);
}

function celebrate(){
  const box=document.getElementById("confetti");
  const colors=["#ff5f8f","#ffd84d","#57b8ff","#79d86f","#a978ff","#ff9d43"];
  for(let i=0;i<70;i++){
    const el=document.createElement("i"); el.className="piece";
    el.style.left=Math.random()*100+"vw";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    el.style.animationDelay=(Math.random()*.35)+"s";
    el.style.width=(7+Math.random()*7)+"px";
    el.style.height=(10+Math.random()*10)+"px";
    box.appendChild(el); setTimeout(()=>el.remove(),2300);
  }
}

document.getElementById("spinBtn").addEventListener("click",spin);
document.getElementById("shareBtn").addEventListener("click",async()=>{
  const data={title:"우리 팀 점심 메뉴 룰렛!",text:"우리 팀 점심 메뉴 룰렛 돌려봐요! 🍴",url:location.href};
  if(navigator.share){ try{await navigator.share(data);}catch(e){} }
  else { await navigator.clipboard.writeText(location.href); alert("링크가 복사됐어요! 팀원에게 보내주세요."); }
});

drawWheel();
</script>
</body>
</html>
