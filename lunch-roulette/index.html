<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지? 점심 메뉴 룰렛</title>
<style>
  /* 폰트 및 전체 페이지 스타일 */
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background-color: #fff5f7; /* 사랑스러운 연핑크 배경 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  h1 {
    color: #ff6b81;
    font-size: 2.5rem;
    text-shadow: 2px 2px 0px #ffeaa7;
    margin-bottom: 30px;
    letter-spacing: -1px;
  }

  /* 룰렛 컨테이너 및 디자인 */
  .roulette-container {
    position: relative;
    width: 380px;
    height: 380px;
    margin-bottom: 40px;
  }

  /* 당첨을 알려주는 화살표 */
  .pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 35px solid #ff4757; /* 강렬한 빨간색 화살표 */
    z-index: 10;
    filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.2));
  }

  canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 10px 25px rgba(255, 107, 129, 0.2);
    border: 6px solid #ffffff;
    /* CSS 애니메이션 (자바스크립트에서 조작) */
    transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  /* 돌리기 버튼 디자인 */
  button {
    background-color: #70a1ff;
    color: white;
    border: none;
    padding: 18px 50px;
    font-size: 22px;
    font-weight: 800;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #537fe7, 0 15px 20px rgba(112, 161, 255, 0.4);
    transition: all 0.1s ease-in-out;
  }

  button:hover {
    background-color: #537fe7;
  }

  button:active, button:disabled {
    transform: translateY(6px);
    box-shadow: 0 0px 0 #537fe7, 0 5px 10px rgba(112, 161, 255, 0.4);
  }
  
  button:disabled {
    background-color: #a4b0be;
    box-shadow: none;
    cursor: not-allowed;
    transform: translateY(0);
  }

  /* 결과 텍스트 */
  #result {
    margin-top: 30px;
    font-size: 28px;
    font-weight: 800;
    color: #2ed573;
    text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
    min-height: 40px;
  }
</style>
</head>
<body>

  <h1>🍽️ 오늘 점심 뭐 먹지?</h1>

  <div class="roulette-container">
    <div class="pointer"></div>
    <!-- 캔버스 사이즈는 선명도를 위해 CSS 크기보다 크게 설정합니다 -->
    <canvas id="wheel" width="500" height="500"></canvas>
  </div>

  <button id="spinBtn" onclick="spin()">돌리기 슝! 🚀</button>
  <div id="result">메뉴를 골라볼까요?</div>

<script>
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const resultText = document.getElementById('result');

  // 메뉴 및 귀여운 파스텔 색상 배열
  const menus = ['김치찌개', '돈까스', '초밥', '샐러드', '쌀국수', '햄버거'];
  const colors = ['#ffb8b8', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#f1cbff'];
  
  const numSlices = menus.length;
  const sliceAngle = (2 * Math.PI) / numSlices;
  
  // 현재 회전 각도 상태
  let currentRotation = 0;
  let isSpinning = false;

  // 룰렛 그리기 함수
  function drawWheel() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2;

    for (let i = 0; i < numSlices; i++) {
      const startAngle = i * sliceAngle;
      const endAngle = startAngle + sliceAngle;

      // 피자 조각 그리기
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 텍스트 그리기
      ctx.save();
      ctx.translate(centerX, centerY);
      // 조각의 중앙 각도로 회전
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2f3542';
      ctx.font = 'bold 32px "Pretendard", sans-serif';
      // 텍스트 위치 (반지름보다 살짝 안쪽)
      ctx.fillText(menus[i], radius - 40, 0);
      ctx.restore();
    }
  }

  // 룰렛 돌리기 함수
  function spin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    resultText.innerText = '두구두구두구... 🥁';
    resultText.style.color = '#747d8c';

    // 랜덤하게 회전할 바퀴 수 (최소 5바퀴 ~ 10바퀴) + 추가 각도
    const spinSpins = Math.floor(Math.random() * 5) + 5;
    const spinDegrees = Math.floor(Math.random() * 360);
    const totalRotation = (spinSpins * 360) + spinDegrees;
    
    currentRotation += totalRotation;

    // CSS로 회전 적용
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    // 3초(트랜지션 시간) 후 결과 계산
    setTimeout(() => {
      // 12시 방향(화살표)에 있는 메뉴 계산
      // 캔버스의 0도는 3시 방향이므로 12시는 270도.
      // 회전된 각도를 빼서 화살표가 가리키는 상대적 각도를 구합니다.
      const normalizedRotation = currentRotation % 360;
      const pointerAngle = (270 - normalizedRotation + 360) % 360;
      
      const winningIndex = Math.floor(pointerAngle / (360 / numSlices));
      const winner = menus[winningIndex];

      resultText.innerHTML = `🎉 오늘의 당첨 메뉴: <span style="color: #ff4757;">[${winner}]</span> 🎉`;
      resultText.style.color = '#2ed573';
      
      isSpinning = false;
      spinBtn.disabled = false;
    }, 3000);
  }

  // 초기 룰렛 그리기
  drawWheel();
</script>
</body>
</html>
